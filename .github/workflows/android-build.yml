name: Build Android App

on:
  push:
    branches: [main, discovery-wifi]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate dash-app manifests
        run: node scripts/validate-manifests.js

      - name: Check web-compose widgets
        run: node scripts/build-compose-widgets.js --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: dashpilot-android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --tests '*TeslaClientProvisionTest' --console=plain 2>&1 | tee build.log

      - name: Surface build errors as annotations
        if: failure()
        working-directory: dashpilot-android
        shell: bash
        run: |
          grep -E '^e: |error:|What went wrong' -A2 build.log | head -40 | sed 's/^/::error::/' || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dashpilot-debug-${{ github.sha }}
          path: dashpilot-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
