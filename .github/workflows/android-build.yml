name: Build Android App

on:
  push:
    branches: [main, comma-via-dashkit]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Validate dash-app manifests
        run: node scripts/validate-manifests.js

      - name: Check web-compose widgets
        run: node scripts/build-compose-widgets.js --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The same debug key every run, so a new build installs as an update. Without the secret Gradle makes a fresh
      # key and each build has to be uninstalled first.
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build debug APK
        working-directory: dashpilot-android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: dashpilot-debug-${{ github.sha }}
          path: dashpilot-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
