<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lanes</title>
  <style>
    :root {
      --bg: #e9ecf0;
      --fg: #11151a;
      --muted: #69717d;
      --glass: rgba(255, 255, 255, 0.62);
      --glass-border: rgba(17, 21, 26, 0.08);
      --accent: #2f7cf6;
      --warn: #f5a623;
      --alert: #ff3b30;
    }
    :root[data-theme="dark"] {
      --bg: #07090c;
      --fg: #f3f5f8;
      --muted: #8b94a3;
      --glass: rgba(18, 22, 28, 0.55);
      --glass-border: rgba(255, 255, 255, 0.07);
      --accent: #3d8bff;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas#scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: absolute;
      left: max(3vw, env(safe-area-inset-left));
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1.6vh;
      padding: 2.4vh 2.2vh;
      border-radius: 2.4vh;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      min-width: 18vh;
      pointer-events: none;
    }
    .speed {
      font-size: 15vh;
      font-weight: 650;
      line-height: 0.88;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }
    .unit {
      font-size: 2.6vh;
      color: var(--muted);
      margin-top: -0.6vh;
    }
    .gears {
      display: flex;
      gap: 1.6vh;
      font-size: 2.8vh;
      font-weight: 600;
      color: var(--muted);
      opacity: 0.6;
    }
    .gears span.active {
      color: var(--fg);
      opacity: 1;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 1.4vh;
    }
    .limit {
      width: 7.5vh;
      height: 7.5vh;
      border-radius: 50%;
      border: 0.9vh solid #e0262b;
      background: #fff;
      color: #111;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 3vh;
      font-weight: 750;
      box-sizing: border-box;
    }
    .pill {
      display: none;
      align-items: center;
      gap: 0.8vh;
      padding: 0.8vh 1.4vh;
      border-radius: 99px;
      font-size: 2vh;
      font-weight: 600;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
    }
    .pill svg { width: 2.4vh; height: 2.4vh; }
    .blinkers {
      position: absolute;
      top: max(3vh, env(safe-area-inset-top));
      left: 62%;
      transform: translateX(-50%);
      display: flex;
      gap: 26vw;
      pointer-events: none;
    }
    .blinkers svg {
      width: 5vh;
      height: 5vh;
      fill: #34c759;
      opacity: 0;
      transition: opacity 0.08s;
    }
    .tpms {
      position: absolute;
      right: max(3vw, env(safe-area-inset-right));
      bottom: max(3vh, env(safe-area-inset-bottom));
      display: none;
      grid-template-columns: auto 2.6vh auto;
      column-gap: 1.2vh;
      row-gap: 1.6vh;
      align-items: center;
      padding: 1.4vh 1.8vh;
      border-radius: 2vh;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
    }
    .tpms svg { grid-column: 2; grid-row: 1 / span 2; width: 2.6vh; height: 5.4vh; }
    .tpms rect { fill: none; stroke: var(--muted); stroke-width: 2; }
    .tyre { display: flex; flex-direction: column; line-height: 1.15; }
    .tyre.left { align-items: flex-end; }
    .tyre b { font-size: 2.2vh; font-weight: 650; font-variant-numeric: tabular-nums; }
    .tyre small { font-size: 1.4vh; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tyre.low b { color: var(--warn); }
    .tyre.critical b { color: var(--alert); }
    .signal {
      position: absolute;
      top: max(3vh, env(safe-area-inset-top));
      right: max(3vw, env(safe-area-inset-right));
      display: none;
      align-items: center;
      gap: 1.2vh;
      padding: 1vh 1.6vh;
      border-radius: 1.6vh;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 2.2vh;
      font-weight: 600;
      pointer-events: none;
    }
    .signal .lamp {
      width: 2.6vh;
      height: 2.6vh;
      border-radius: 50%;
      box-shadow: 0 0 1.6vh currentColor;
      background: currentColor;
    }
    .glow {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .glow.top {
      left: 0; right: 0; top: 0; height: 22vh;
      background: linear-gradient(to bottom, rgba(255, 59, 48, 0.55), transparent);
      animation: pulse 0.5s ease-in-out infinite alternate;
    }
    .glow.left, .glow.right { top: 0; bottom: 0; width: 14vw; }
    .glow.left { left: 0; background: linear-gradient(to right, rgba(255, 59, 48, 0.45), transparent); }
    .glow.right { right: 0; background: linear-gradient(to left, rgba(255, 59, 48, 0.45), transparent); }
    @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(0.55); } }
    .alert {
      position: absolute;
      top: 9vh;
      left: 62%;
      transform: translateX(-50%);
      padding: 1vh 2vh;
      border-radius: 99px;
      background: var(--alert);
      color: #fff;
      font-size: 2.4vh;
      font-weight: 700;
      display: none;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="glow top" id="fcwGlow"></div>
  <div class="glow left" id="leftGlow"></div>
  <div class="glow right" id="rightGlow"></div>
  <div class="blinkers">
    <svg id="leftBlink" viewBox="0 0 24 24"><path d="M10 5 3 12l7 7v-4h11V9H10z"/></svg>
    <svg id="rightBlink" viewBox="0 0 24 24"><path d="m14 5 7 7-7 7v-4H3V9h11z"/></svg>
  </div>
  <div class="alert" id="alert">Collision warning</div>
  <div class="hud">
    <div>
      <div class="speed" id="speed">0</div>
      <div class="unit" id="unit">km/h</div>
    </div>
    <div class="gears" id="gears"><span>P</span><span>R</span><span>N</span><span>D</span></div>
    <div class="row">
      <div class="limit" id="limit"></div>
      <div class="pill" id="assist">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 3a7 7 0 0 1 6.9 6h-3.1a4 4 0 0 0-7.6 0H5.1A7 7 0 0 1 12 5Zm-1 13.9A7 7 0 0 1 5.1 13H8a4 4 0 0 0 3 3v2.9Zm2 0V16a4 4 0 0 0 3-3h2.9a7 7 0 0 1-5.9 5.9Z"/></svg>
        <span>Autosteer</span>
      </div>
    </div>
  </div>
  <div class="tpms" id="tpms">
    <div class="tyre left" id="tpmsFL"><b></b><small></small></div>
    <svg viewBox="0 0 22 46" aria-hidden="true"><rect x="2" y="2" width="18" height="42" rx="7" /></svg>
    <div class="tyre" id="tpmsFR"><b></b><small></small></div>
    <div class="tyre left" id="tpmsRL"><b></b><small></small></div>
    <div class="tyre" id="tpmsRR"><b></b><small></small></div>
  </div>
  <div class="signal" id="signal"><div class="lamp" id="lamp"></div><span id="signalText"></span></div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "./vendor/three/GLTFLoader.js";
    import { RoomEnvironment } from "./vendor/three/RoomEnvironment.js";

    // ---- Conventions -------------------------------------------------------
    // Car data: x/dx forward (m), y/dy left (m). three.js world: -Z forward,
    // +X right, +Y up; the ego car's center is the origin.
    const toWorldX = (left) => -left;
    const toWorldZ = (forward) => -forward;

    const EGO_LENGTH = 4.75;            // Model Y (2020-2024)
    const EGO_HALF = EGO_LENGTH / 2;
    const DEFAULT_LANE_WIDTH = 3.6;
    const ROAD_BEHIND = 18;             // m drawn behind the car
    const ROAD_AHEAD = 90;
    const ROAD_STEP = 1.5;
    // Flip if the lane bends the wrong way on a real drive (DAS_lanes sign
    // is not verified yet).
    const LANE_SIGN = 1;

    // Midnight Silver Metallic: dark grey with metallic flake and clear coat.
    const EGO_PAINT = { color: 0x5a5d61, metalness: 0.78, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.06 };

    // Blind spot cars rotate through these so traffic doesn't look cloned.
    const CAR_MODELS = ["car-sedan", "car-suv", "car-hatchback", "car-ev", "car-pickup"];
    const PAINTS = [0xe9eaec, 0x1d2025, 0x9ea4ab, 0x2c4c7c, 0x7d2329, 0x4b5257, 0xc9c2b4];

    // ---- Renderer, scene, lighting -----------------------------------------
    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.fog = new THREE.Fog(0x07090c, 40, 95);

    const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x1a1d22, 0.55);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(-6, 12, 4);
    scene.add(sun);

    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);

    // ---- Smoothing --------------------------------------------------------
    // Critically damped spring (SmoothDamp): continuous velocity, so values
    // that step at the data rate (10-25 Hz) glide at the display rate.
    class Smoother {
      constructor(value) { this.value = value; this.velocity = 0; this.lastMs = undefined; }
      update(target, smoothMs, now) {
        if (this.lastMs === undefined) { this.lastMs = now; return this.value; }
        const dt = Math.min(0.1, Math.max(0, (now - this.lastMs) / 1000));
        this.lastMs = now;
        const omega = 2 / Math.max(0.001, smoothMs / 1000);
        const x = omega * dt;
        const decay = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
        const change = this.value - target;
        const temp = (this.velocity + omega * change) * dt;
        this.velocity = (this.velocity - omega * temp) * decay;
        this.value = target + (change + temp) * decay;
        return this.value;
      }
    }

    // ---- Ribbons (road, lane lines, path, zones) ---------------------------
    // A strip along a lateral function f(d) (m, + = left) at offsets
    // [o0, o1] from it, sampled every ROAD_STEP. uv: u across, v = distance.
    class Ribbon {
      constructor(material, d0, d1, step = ROAD_STEP) {
        this.d0 = d0; this.step = step;
        this.n = Math.max(2, Math.round((d1 - d0) / step) + 1);
        const g = new THREE.BufferGeometry();
        this.pos = new Float32Array(this.n * 2 * 3);
        const uv = new Float32Array(this.n * 2 * 2);
        const idx = [];
        for (let i = 0; i < this.n; i++) {
          uv.set([0, d0 + i * step, 1, d0 + i * step], i * 4);
          if (i < this.n - 1) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
        }
        g.setAttribute("position", new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
        g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
        // Flat road: every vertex faces up (lit materials need normals).
        const normals = new Float32Array(this.n * 2 * 3);
        for (let i = 1; i < normals.length; i += 3) normals[i] = 1;
        g.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
        g.setIndex(idx);
        this.mesh = new THREE.Mesh(g, material);
        this.mesh.frustumCulled = false;
        this.uv = uv;
      }
      update(f, o0, o1, y = 0, d0 = this.d0) {
        const h = 0.25;
        for (let i = 0; i < this.n; i++) {
          const d = d0 + i * this.step;
          const c = f(d);
          const slope = (f(d + h) - f(d - h)) / (2 * h);
          const inv = 1 / Math.sqrt(1 + slope * slope);
          for (const [k, o] of [[0, o0], [1, o1]]) {
            const fwd = d - o * slope * inv;
            const left = c + o * inv;
            this.pos.set([toWorldX(left), y, toWorldZ(fwd)], (i * 2 + k) * 3);
          }
          this.uv[i * 4 + 1] = d; this.uv[i * 4 + 3] = d;
        }
        this.mesh.geometry.attributes.position.needsUpdate = true;
        this.mesh.geometry.attributes.uv.needsUpdate = true;
      }
    }

    // Unlit line/band shader: optional dashes scrolling with the car, fades
    // out with distance, optional chevrons for the driving path.
    function bandMaterial({ color, opacity, dashed = false, chevrons = false }) {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uColor: { value: new THREE.Color(color) },
          uOpacity: { value: opacity },
          uScroll: { value: 0 },
          uFar: { value: 80 },
          uDashed: { value: dashed ? 1 : 0 },
          uChevrons: { value: chevrons ? 1 : 0 },
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity, uScroll, uFar, uDashed, uChevrons;
          varying vec2 vUv;
          void main() {
            float d = vUv.y;
            float a = uOpacity;
            a *= 1.0 - smoothstep(uFar * 0.55, uFar, d);
            a *= smoothstep(-14.0, -6.0, d);
            if (uDashed > 0.5) {
              float m = mod(d + uScroll, 9.0);
              a *= smoothstep(0.0, 0.25, m) * (1.0 - smoothstep(3.0, 3.25, m));
            }
            vec3 col = uColor;
            if (uChevrons > 0.5) {
              float across = abs(vUv.x - 0.5);
              float edge = smoothstep(0.5, 0.36, across);
              float chev = fract((d + uScroll * 0.6 - across * 3.0) / 6.0);
              float band = smoothstep(0.0, 0.08, chev) * (1.0 - smoothstep(0.22, 0.3, chev));
              a *= edge * (0.55 + 0.45 * band);
              col = mix(uColor, vec3(1.0), band * 0.18);
            }
            if (a < 0.003) discard;
            gl_FragColor = vec4(col, a);
          }`,
      });
    }

    // Ground beyond the road, fading into the fog.
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x0d1014, roughness: 1, metalness: 0 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    scene.add(ground);

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1d22, roughness: 0.92, metalness: 0 });
    const road = new Ribbon(roadMat, -ROAD_BEHIND, ROAD_AHEAD);
    scene.add(road.mesh);

    // Lane lines: index -2..1 is the boundary at (i + 0.5) lanes from center.
    const lineMats = {}, lines = {};
    for (const i of [-2, -1, 1, 2]) {
      const outer = Math.abs(i) === 2;
      lineMats[i] = bandMaterial({ color: 0xf2f4f7, opacity: outer ? 0.55 : 0.8, dashed: !outer });
      lines[i] = new Ribbon(lineMats[i], -ROAD_BEHIND, ROAD_AHEAD, 0.75);
      lines[i].mesh.renderOrder = 2;
      scene.add(lines[i].mesh);
    }
    const pathMat = bandMaterial({ color: 0x3d8bff, opacity: 0.55, chevrons: true });
    const path = new Ribbon(pathMat, -3, 70, 0.75);
    path.mesh.renderOrder = 1;
    scene.add(path.mesh);
    const zoneMats = { left: bandMaterial({ color: 0xf5a623, opacity: 0 }), right: bandMaterial({ color: 0xf5a623, opacity: 0 }) };
    const zones = { left: new Ribbon(zoneMats.left, -9, 2, 0.5), right: new Ribbon(zoneMats.right, -9, 2, 0.5) };
    for (const z of Object.values(zones)) { z.mesh.renderOrder = 1; scene.add(z.mesh); }
    const stopLineMat = bandMaterial({ color: 0xffffff, opacity: 0 });
    const stopLine = new Ribbon(stopLineMat, 0, 0.5, 0.5);
    stopLine.mesh.renderOrder = 3;
    scene.add(stopLine.mesh);

    // ---- Models ------------------------------------------------------------
    const loader = new GLTFLoader();
    const prototypes = {};

    // Soft contact shadow under a vehicle.
    const shadowTex = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const g = c.getContext("2d");
      const grd = g.createRadialGradient(64, 64, 8, 64, 64, 64);
      grd.addColorStop(0, "rgba(0,0,0,0.75)");
      grd.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grd;
      g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    function contactShadow(width, length) {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(width * 1.35, length * 1.2),
        new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }),
      );
      m.rotation.x = -Math.PI / 2;
      m.position.y = 0.01;
      m.renderOrder = 4;
      return m;
    }

    // Wraps a loaded glTF scene so it faces -Z (forward), sits on the ground
    // and is centered; models in the pack face +Z, in meters.
    function normalize(root, { targetLength = null, faceForwardZ = 1 } = {}) {
      root.updateMatrixWorld(true);
      const box = new THREE.Box3();
      root.traverse((m) => { if (m.isMesh && m.visible) box.union(new THREE.Box3().setFromObject(m)); });
      const size = box.getSize(new THREE.Vector3());
      const lengthAxisX = size.x > size.z;
      const length = Math.max(size.x, size.z);
      const scale = targetLength ? targetLength / length : 1;
      const center = box.getCenter(new THREE.Vector3());
      const inner = new THREE.Group();
      root.position.sub(new THREE.Vector3(center.x, box.min.y, center.z));
      inner.add(root);
      if (lengthAxisX) inner.rotation.y = -Math.PI / 2;
      const outer = new THREE.Group();
      inner.scale.setScalar(scale);
      // Pack models face +Z; turn them to face -Z (forward).
      if (faceForwardZ > 0) inner.rotation.y += Math.PI;
      outer.add(inner);
      outer.userData.length = length * scale;
      outer.userData.width = Math.min(size.x, size.z) * scale;
      return outer;
    }

    async function loadPrototype(name) {
      if (prototypes[name]) return prototypes[name];
      prototypes[name] = loader.loadAsync(`./models/${name}.glb`).then((g) => normalize(g.scene));
      return prototypes[name];
    }

    async function loadEgo() {
      // A user-supplied models/ego.glb (glTF convention, front toward +Z)
      // replaces the bundled Model Y without a code change.
      let g;
      try {
        g = await loader.loadAsync("./models/ego.glb");
      } catch (_err) {
        g = await loader.loadAsync("./models/ego-model-y.glb");
        // The bundled Model Y's body is its "paint" material: give it
        // Midnight Silver Metallic's flake and clear coat.
        g.scene.traverse((m) => {
          if (m.isMesh && m.material?.name === "paint") m.material = new THREE.MeshPhysicalMaterial(EGO_PAINT);
        });
      }
      return normalize(g.scene, { targetLength: EGO_LENGTH });
    }

    let ego = null;
    loadEgo().then((m) => {
      ego = m;
      ego.add(contactShadow(ego.userData.width, ego.userData.length));
      scene.add(ego);
    }).catch((err) => console.error("ego model failed", err));

    // ---- Vehicle tracks ----------------------------------------------------
    class Track {
      constructor(id) { this.id = id; this.obj = null; this.modelName = null; this.loading = null; }
      async setModel(variant) {
        const name = CAR_MODELS[variant % CAR_MODELS.length];
        if (name === this.modelName || this.loading === name) return;
        this.loading = name;
        const proto = await loadPrototype(name);
        if (this.loading !== name) return;
        const obj = proto.clone(true);
        const paint = PAINTS[variant % PAINTS.length];
        obj.traverse((m) => {
          if (m.isMesh && /paint/i.test(m.material?.name || "")) {
            m.material = m.material.clone();
            m.material.color = new THREE.Color(paint);
            m.material.metalness = Math.max(m.material.metalness, 0.45);
            m.material.roughness = Math.min(m.material.roughness, 0.4);
            m.userData.paint = m.material;
          }
        });
        obj.add(contactShadow(proto.userData.width, proto.userData.length));
        obj.userData.length = proto.userData.length;
        if (this.obj) scene.remove(this.obj);
        this.obj = obj;
        this.modelName = name;
        this.loading = null;
        scene.add(obj);
      }
      place(forwardCenter, left, heading, visible) {
        if (!this.obj) return;
        this.obj.visible = visible;
        this.obj.position.set(toWorldX(left), 0, toWorldZ(forwardCenter));
        this.obj.rotation.y = heading;
      }
      hide() { if (this.obj) this.obj.visible = false; }
      warn(level, now) {
        if (!this.obj) return;
        const pulse = level > 0 ? 0.55 + 0.45 * Math.sin(now / 90) : 0;
        this.obj.traverse((m) => {
          if (m.userData?.paint) {
            m.userData.paint.emissive = new THREE.Color(level >= 2 ? 0xff2a1f : 0xf5a623);
            m.userData.paint.emissiveIntensity = level > 0 ? 0.35 * pulse : 0;
          }
        });
      }
    }

    const tracks = {
      left: new Track("left"), right: new Track("right"),
    };
    let spawnCounter = 0;

    // ---- State helpers -----------------------------------------------------
    const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };

    function egoSpeedMs(car) {
      const v = Math.max(0, num(car.egoSpeed));
      return car.isImperial ? v * 0.44704 : v / 3.6;
    }

    // Lane center (m, + = left) at distance d, from DAS_lanes.
    function laneFn(car) {
      if (!(num(car.laneViewRange) > 0)) return () => 0;
      const c0 = num(car.laneC0), c1 = num(car.laneC1), c2 = num(car.laneC2), c3 = num(car.laneC3);
      return (d) => LANE_SIGN * (c0 + d * (c1 + d * (c2 + d * c3)));
    }

    // Path the car will drive at its steering angle (bicycle model).
    const STEER_RATIO = 12.0, WHEELBASE_M = 2.89, UNDERSTEER = 0.0012, MAX_K = 0.1;
    function steeringCurvature(car) {
      const wheelDeg = -num(car.egoSteeringAngle) / STEER_RATIO;  // car: negative = left
      const v = egoSpeedMs(car);
      const k = Math.tan(wheelDeg * Math.PI / 180) / (WHEELBASE_M * (1 + UNDERSTEER * v * v));
      return Math.max(-MAX_K, Math.min(MAX_K, k));
    }

    // ---- Side tracks (blind spot monitor) ----------------------------------
    // Same model as the vanilla dashboard: one tracked vehicle per side. BSM
    // reports presence but no position, so the car slides in from off-screen
    // behind into the blind spot zone and drops back out when it clears.
    const BSM_FORWARD = -3, OFFSCREEN = -18, GONE = -15;
    const side = {
      left: { x: undefined, sm: null, source: undefined, switchUntil: 0, variant: 0 },
      right: { x: undefined, sm: null, source: undefined, switchUntil: 0, variant: 0 },
    };

    function bsmLevel(car, s) {
      const alwaysOn = car.alwaysOnBlindSpotMonitor !== false;
      const blinker = num(car[s + "Blinker"]) > 0;
      const warn = Math.round(num(car.sideCollisionWarning));
      const sideWarn = s === "left" ? warn === 1 || warn === 3 : warn === 2 || warn === 3;
      const bsm = num(car[s + "BlindSpot"]);
      if (sideWarn) return 2;
      if (bsm > 0 && (alwaysOn || blinker)) return bsm >= 2 || blinker ? 2 : 1;
      return 0;
    }

    function updateSide(car, s, lane, laneWidth, now) {
      const t = side[s];
      const sign = s === "left" ? 1 : -1;
      const level = bsmLevel(car, s);
      let target = null;
      if (level > 0) target = { x: BSM_FORWARD, source: "bsm" };
      else if (t.x !== undefined && t.x > GONE) target = { x: OFFSCREEN, source: "exit" };

      const tr = tracks[s];
      if (!target) { t.x = undefined; t.source = undefined; tr.hide(); return; }
      if (t.x === undefined) {
        t.variant = ++spawnCounter;
        t.sm = new Smoother(OFFSCREEN);
        t.switchUntil = now + 1200;
      } else if (t.source !== target.source) {
        t.switchUntil = now + 1200;
      }
      t.x = t.sm.update(target.x, now < t.switchUntil ? 600 : 250, now);
      t.source = target.source;
      tr.setModel(t.variant);
      tr.place(t.x, lane(t.x) + sign * laneWidth, 0, true);
      tr.warn(level, now);
    }

    // ---- Per-frame world update --------------------------------------------
    const laneSm = { c0: new Smoother(0), c1: new Smoother(0), c2: new Smoother(0), c3: new Smoother(0), w: new Smoother(DEFAULT_LANE_WIDTH) };
    const pathSm = new Smoother(0);
    const CAM = { back: 12.5, up: 5.6, backBlink: 14.5, upBlink: 6.6, lookAhead: 22 };
    const camSm = { back: new Smoother(CAM.back), up: new Smoother(CAM.up) };
    let scroll = 0;
    let lastFrameMs = 0;
    let latestCar = null;

    function smoothedLane(car, now) {
      const has = num(car.laneViewRange) > 0;
      const c = has ? [num(car.laneC0), num(car.laneC1), num(car.laneC2), num(car.laneC3)] : [0, 0, 0, 0];
      const c0 = laneSm.c0.update(c[0], 200, now), c1 = laneSm.c1.update(c[1], 200, now);
      const c2 = laneSm.c2.update(c[2], 200, now), c3 = laneSm.c3.update(c[3], 200, now);
      const w = laneSm.w.update(has ? num(car.laneWidth, DEFAULT_LANE_WIDTH) || DEFAULT_LANE_WIDTH : DEFAULT_LANE_WIDTH, 300, now);
      return { fn: (d) => LANE_SIGN * (c0 + d * (c1 + d * (c2 + d * c3))), width: w, has };
    }

    function frame(now) {
      requestAnimationFrame(frame);
      const dt = lastFrameMs ? Math.min(0.1, (now - lastFrameMs) / 1000) : 0;
      lastFrameMs = now;
      const car = latestCar || {};
      const v = egoSpeedMs(car);
      scroll += v * dt;

      const lane = smoothedLane(car, now);
      const L = lane.fn, W = lane.width;

      road.update(L, -1.5 * W - 0.6, 1.5 * W + 0.6, 0);
      const ldw = Math.round(num(car.laneDepartureWarning));
      for (const i of [-2, -1, 1, 2]) {
        const o = (i > 0 ? i - 0.5 : i + 0.5) * W;  // i: -2,-1 right side; 1,2 left side
        lines[i].update(L, o - 0.06, o + 0.06, 0.02);
        lineMats[i].uniforms.uScroll.value = scroll;
        const departing = (i === 1 && (ldw === 1 || ldw === 3)) || (i === -1 && (ldw === 2 || ldw === 4));
        lineMats[i].uniforms.uColor.value.set(departing ? 0xff3b30 : 0xf2f4f7);
        lineMats[i].uniforms.uOpacity.value = departing ? 1 : Math.abs(i) === 2 ? 0.55 : 0.8;
      }

      // Driving path: the lane under lane keeping, otherwise the steering
      // prediction in D.
      const assist = !!(car.adasOn || car.madsActive);
      const gear = Math.round(num(car.gear));
      const k = pathSm.update(assist && lane.has ? 0 : gear === 4 ? steeringCurvature(car) : 0, 200, now);
      const pathFn = assist && lane.has ? L : (d) => (k * d * Math.max(d, 0)) / 2;
      const pathRange = Math.min(70, Math.abs(k) > 1e-4 ? 1 / Math.abs(k) : 70);
      path.update(pathFn, -1.05, 1.05, 0.03);
      pathMat.uniforms.uFar.value = Math.max(12, pathRange);
      pathMat.uniforms.uScroll.value = scroll;
      pathMat.uniforms.uColor.value.set(assist ? 0x3d8bff : 0xc8ced8);
      pathMat.uniforms.uOpacity.value = gear === 4 ? (assist ? 0.6 : 0.32) : 0;

      // Blind spot zones.
      for (const s of ["left", "right"]) {
        const level = bsmLevel(car, s);
        const sign = s === "left" ? 1 : -1;
        zones[s].update(L, sign * W * 0.5 + 0.15 * sign, sign * W * 1.5 - 0.15 * sign, 0.025);
        zoneMats[s].uniforms.uColor.value.set(level >= 2 ? 0xff3b30 : 0xf5a623);
        zoneMats[s].uniforms.uOpacity.value = level > 0 ? (level >= 2 ? 0.45 : 0.36) : 0;
        updateSide(car, s, L, W, now);
      }

      // Stop line from DAS_road.
      const stopDist = num(car.stopLineDist);
      if (stopDist > 0.5 && stopDist < 80) {
        stopLine.update(L, -W / 2 + 0.1, W / 2 - 0.1, 0.035, EGO_HALF + stopDist);
        stopLineMat.uniforms.uOpacity.value = 0.95;
      } else stopLineMat.uniforms.uOpacity.value = 0;

      // Camera: pulls back while a blinker is on.
      const blinking = num(car.leftBlinker) > 0 || num(car.rightBlinker) > 0;
      const back = camSm.back.update(blinking ? CAM.backBlink : CAM.back, 700, now);
      const up = camSm.up.update(blinking ? CAM.upBlink : CAM.up, 700, now);
      camera.position.set(0, up, back);
      // Look a little into the bend so the road ahead stays framed.
      camera.lookAt(toWorldX(L(CAM.lookAhead) * 0.35), 0.4, toWorldZ(CAM.lookAhead));

      renderer.render(scene, camera);
    }

    // ---- HUD ---------------------------------------------------------------
    const $ = (id) => document.getElementById(id);

    const GEARS = { 1: 0, 2: 1, 3: 2, 4: 3 };
    function updateHud(car) {
      if (typeof car.darkMode === "boolean") {
        document.documentElement.setAttribute("data-theme", car.darkMode ? "dark" : "light");
      }
      const dark = document.documentElement.getAttribute("data-theme") !== "light";
      const bg = dark ? 0x07090c : 0xe9ecf0;
      scene.fog.color.set(bg);
      renderer.setClearColor(bg);
      roadMat.color.set(dark ? 0x1c2026 : 0x8f959e);
      groundMat.color.set(dark ? 0x0d1014 : 0xd5d9df);

      $("speed").textContent = String(Math.max(0, Math.round(num(car.egoSpeed))));
      $("unit").textContent = car.isImperial ? "mph" : "km/h";
      const g = GEARS[Math.round(num(car.gear))];
      [...$("gears").children].forEach((el, i) => el.classList.toggle("active", i === g));
      const limit = Math.round(num(car.fusedSpeedLimit));
      $("limit").style.display = limit > 0 ? "flex" : "none";
      $("limit").textContent = String(limit);
      $("assist").style.display = car.adasOn || car.madsActive ? "flex" : "none";

      const blink = (v, el) => { el.style.opacity = num(v) === 2 ? "1" : num(v) === 1 ? "0.25" : "0"; };
      blink(car.leftBlinker, $("leftBlink"));
      blink(car.rightBlinker, $("rightBlink"));

      const fcw = num(car.forwardCollisionWarning) > 0;
      $("fcwGlow").style.opacity = fcw ? "1" : "0";
      $("alert").style.display = fcw ? "block" : "none";
      for (const s of ["left", "right"]) $(s + "Glow").style.opacity = bsmLevel(car, s) >= 2 ? "1" : "0";

      // Traffic light from DAS_road.
      const roadColors = { 1: "#ff3b30", 2: "#34c759", 3: "#ffcc00" };
      let color = null, text = "";
      const dist = (m) => (car.isImperial ? Math.round(m * 3.28084) + " ft" : Math.round(m) + " m");
      if (roadColors[Math.round(num(car.trafficLightColor))]) {
        color = roadColors[Math.round(num(car.trafficLightColor))];
        text = num(car.stopLineDist) > 0 ? dist(num(car.stopLineDist)) : "";
      }
      $("signal").style.display = color ? "flex" : "none";
      if (color) { $("lamp").style.color = color; $("signalText").textContent = text.trim(); }

      updateTpms(car);

      const q = Math.round(num(car.renderQuality, 3));
      const ratio = q <= 1 ? 1 : q === 2 ? 1.5 : Math.min(2.5, devicePixelRatio || 1);
      if (renderer.getPixelRatio() !== ratio) { renderer.setPixelRatio(ratio); resize(); }
    }

    // Tyre pressures are shown in psi whatever the units setting. Amber below
    // TPMS_LOW_BAR, red below TPMS_CRITICAL_BAR (Model Y placard: 2.9 bar).
    const TPMS_LOW_BAR = 2.5, TPMS_CRITICAL_BAR = 2.2, BAR_TO_PSI = 14.5038;
    function updateTpms(car) {
      const wheels = ["FL", "FR", "RL", "RR"];
      const any = wheels.some((w) => num(car["tpmsPressure" + w], -1) >= 0);
      $("tpms").style.display = any ? "grid" : "none";
      if (!any) return;
      for (const w of wheels) {
        const el = $("tpms" + w);
        const bar = num(car["tpmsPressure" + w], -1);
        const temp = num(car["tpmsTemp" + w], -100);
        const known = bar >= 0;
        el.querySelector("b").textContent = !known ? "--"
          : Math.round(bar * BAR_TO_PSI) + " psi";
        el.querySelector("small").textContent = temp > -100
          ? (car.isImperial ? Math.round(temp * 9 / 5 + 32) + "°F" : Math.round(temp) + "°C") : "";
        el.classList.toggle("critical", known && bar < TPMS_CRITICAL_BAR);
        el.classList.toggle("low", known && bar >= TPMS_CRITICAL_BAR && bar < TPMS_LOW_BAR);
      }
    }

    function resize() {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      // Keep the road framed on the right of the HUD on wide screens.
      camera.setViewOffset(innerWidth, innerHeight, -innerWidth * 0.12, 0, innerWidth, innerHeight);
      camera.updateProjectionMatrix();
    }
    addEventListener("resize", resize);
    resize();

    function receive(car) {
      latestCar = car;
      updateHud(car);
    }

    // ---- Data intake: iOS pushes an object, Android exposes getters ---------
    window.receiveMessage = receive;
    const KEYS = [
      "egoSpeed", "egoSteeringAngle", "gear", "fusedSpeedLimit", "leftBlinker", "rightBlinker",
      "leftBlindSpot", "rightBlindSpot", "adasOn", "madsActive", "accSetSpeed",
      "trafficLightColor", "stopLineDist",
      "tpmsPressureFL", "tpmsPressureFR", "tpmsPressureRL", "tpmsPressureRR",
      "tpmsTempFL", "tpmsTempFR", "tpmsTempRL", "tpmsTempRR",
      "laneWidth", "laneViewRange", "laneC0", "laneC1", "laneC2", "laneC3",
      "forwardCollisionWarning", "laneDepartureWarning", "sideCollisionWarning",
      "isImperial", "darkMode", "alwaysOnBlindSpotMonitor", "renderQuality",
    ];
    function fromAndroid() {
      const n = window.NativeCarState, s = {};
      for (const k of KEYS) {
        const cap = k[0].toUpperCase() + k.slice(1);
        const m = k === "isImperial" ? k : n["get" + cap] ? "get" + cap : "is" + cap;
        try { if (typeof n[m] === "function") s[k] = n[m](); } catch (_err) { /* older app build */ }
      }
      return s;
    }
    window.onCarStateUpdate = () => receive(fromAndroid());

    // ---- Standalone demo: open index.html?demo in a browser ----------------
    const params = new URLSearchParams(location.search);
    if (params.has("demo")) {
      const t0 = performance.now();
      setInterval(() => {
        const t = (performance.now() - t0) / 1000;
        const lap = t % 60, lm = t % 23, rm = t % 29;
        const turning = lap >= 20 && lap < 28;
        const ease = turning ? Math.sin(((lap - 20) / 8) * Math.PI) : 0;
        const tyre = (base, phase) => base + 0.03 * Math.sin((t + phase) * 0.05);
        const warm = 35 - 17 * Math.exp(-t / 300);
        receive({
          egoSpeed: 92 - 25 * ease, gear: 4, fusedSpeedLimit: 100,
          egoSteeringAngle: -60 * ease, adasOn: !turning,
          leftBlinker: turning ? (t % 1 < 0.5 ? 2 : 1) : 0, rightBlinker: 0,
          leftBlindSpot: lm < 3 ? 1 : 0, rightBlindSpot: rm < 3 ? 1 : 0,
          // Rear right tyre slowly leaks down to a warning.
          tpmsPressureFL: tyre(2.9, 0), tpmsPressureFR: tyre(2.88, 7), tpmsPressureRL: tyre(2.86, 13),
          tpmsPressureRR: 2.9 - 0.8 * Math.min(1, (t % 120) / 72),
          tpmsTempFL: warm, tpmsTempFR: warm + 0.5, tpmsTempRL: warm - 1, tpmsTempRR: warm - 0.5,
          laneDepartureWarning: t % 37 < 1.5 ? 1 : 0,
          laneWidth: 3.6, laneViewRange: 60, laneC2: 0.003 * ease + 0.0004 * Math.sin(t * 0.05),
          isImperial: false, darkMode: !params.has("light"), alwaysOnBlindSpotMonitor: true, renderQuality: 3,
        });
      }, 100);
    } else {
      receive({ gear: 4 });
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
