<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300; font-display: swap; src: url('fonts/inter-300.ttf') format('truetype'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/inter-400.ttf') format('truetype'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/inter-500.ttf') format('truetype'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/inter-600.ttf') format('truetype'); }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <title>Dashpilot</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #111;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      border: none !important;
      outline: none !important;
      z-index: 1;
    }

    #bevy-canvas {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: max(100vw, 177.78vh) !important;
      height: max(100vh, 56.25vw) !important;
      display: block !important;
      outline: none !important;
      border: none !important;
    }

    #speedSignRow {
      position: fixed;
      top: 70px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 2000;
    }

    #accSetSpeed {
      font-family: "Inter", sans-serif;
      font-size: 36px;
      font-weight: 400;
      color: #d3d3d3;
      user-select: none;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    #accMax {
      font-size: 14px;
      color: inherit;
    }

    #speedLimitSign {
      width: 80px;
      height: 80px;
      border: 8px solid red;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: "Inter", sans-serif;
      color: black;
      font-size: 32px;
      font-weight: 600;
      user-select: none;
      box-sizing: border-box;
    }

    #leftBlindSpot {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 100vh;
      pointer-events: none;
      background: linear-gradient(to right, rgba(255,0,0,0.5), rgba(255,0,0,0));
      z-index: 1000;
      display: none;
    }

    #collisionWarning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 140px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(255,0,0,0.6), rgba(255,0,0,0));
      z-index: 1000;
      display: none;
      animation: collisionPulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes collisionPulse {
      from { opacity: 1; }
      to { opacity: 0.35; }
    }

    #rightBlindSpot {
      position: fixed;
      top: 0;
      right: 0;
      width: 150px;
      height: 100vh;
      pointer-events: none;
      background: linear-gradient(to left, rgba(255,0,0,0.5), rgba(255,0,0,0));
      z-index: 1000;
      display: none;
    }

    #leftArea {
      position: fixed;
      top: 30px;
      left: 50px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      z-index: 2000;
    }

    #powerBar {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 8px;
      height: 220px;
      margin-top: 50px;
    }

    #powerBarTrack {
      position: relative;
      width: 100%;
      height: 100%;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
    }

    #powerBarCenter {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: #999;
    }

    #powerBarFill {
      position: absolute;
      left: 0;
      right: 0;
      background: #5cbd68;
      transition: top 0.1s ease, height 0.1s ease;
    }

    #leftColumn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      margin-top: 20px;
    }

    #speedRow {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    #speedText {
      font-size: 84px;
      font-weight: 300;
      line-height: 1;
    }

    #speedUnit {
      font-size: 18px;
      color: #777;
    }

    #gearText {
      font-size: 18px;
      font-weight: 500;
      padding: 4px 24px;
      border-radius: 6px;
      background: rgb(173,179,179);
      color: #fff;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 50px;
      height: 32px;
      box-sizing: border-box;
    }

    #steeringContainer {
      position: relative;
      width: 55px;
      height: 55px;
      margin-top: 12px;
      color: rgb(94,95,97);
    }

    #steeringWheel {
      width: 100%;
      height: 100%;
      transition: transform 0.1s linear;
    }

    #blinkerRow {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 2000;
    }

    #leftBlinkerIcon,
    #rightBlinkerIcon {
      width: 34px;
    }

    #steeringAngleRow {
      display: none;
      margin-top: 8px;
      font-size: 16px;
      color: #666;
    }

    #steeringAngle {
      font-weight: 500;
      color: #111;
    }

    #warningIcons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #seatbeltIcon {
      width: 32px;
      height: 32px;
      filter: brightness(0) saturate(100%) invert(19%) sepia(97%) saturate(7482%) hue-rotate(358deg) brightness(102%) contrast(113%);
      display: none;
    }

    #doorIcon {
      width: 32px;
      height: 32px;
      filter: brightness(0) saturate(100%) invert(19%) sepia(97%) saturate(7482%) hue-rotate(358deg) brightness(102%) contrast(113%);
      display: none;
    }

    #driverAlert {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.72);
      color: #ffffff;
      padding: 8px 22px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      z-index: 3000;
      display: none;
    }

    #bottomLeft {
      position: fixed;
      bottom: 30px;
      left: 50px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: "Inter", sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #777;
      z-index: 2000;
      user-select: none;
    }

    #statusBar {
      position: fixed;
      top: 30px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 2000;
      user-select: none;
      font-family: "Inter", sans-serif;
      font-size: 13px;
    }

    .battery-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .battery-label {
      font-weight: 500;
      color: #999;
      font-size: 12px;
    }

    .battery-shell {
      position: relative;
      width: 28px;
      height: 14px;
      border: 2px solid #bbb;
      border-radius: 3px;
      background: transparent;
    }

    .battery-shell::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 7px;
      background: #bbb;
      border-radius: 0 1px 1px 0;
    }

    .battery-fill {
      position: absolute;
      left: 2px;
      top: 2px;
      bottom: 2px;
      width: 0%;
      max-width: calc(100% - 4px);
      border-radius: 1px;
      transition: width 0.3s ease;
    }

    .battery-percent {
      font-weight: 500;
      color: #555;
      font-size: 13px;
    }

    .status-separator {
      width: 1px;
      height: 16px;
      background: #ddd;
    }

    #batteryTempText {
      font-weight: 400;
      color: #777;
      font-size: 13px;
    }

    /* Dark mode overrides: brighten text so it stands out on the dark scene */
    body.dark-mode {
      color: #f2f2f2;
    }

    body.dark-mode #speedText {
      color: #ffffff;
    }

    body.dark-mode #speedUnit {
      color: #cfcfcf;
    }

    body.dark-mode #bottomLeft {
      color: #cfcfcf;
    }

    body.dark-mode .battery-label {
      color: #cfcfcf;
    }

    body.dark-mode .battery-percent {
      color: #ffffff;
    }

    body.dark-mode #batteryTempText {
      color: #cfcfcf;
    }

    body.dark-mode #speedLimitSign {
      color: #ffffff;
    }

    /* Tyre pressures around a top-down car outline, bottom right. */
    #tpms {
      position: fixed;
      bottom: 30px;
      right: 110px;
      display: none;
      grid-template-columns: auto 22px auto;
      grid-template-rows: auto auto;
      column-gap: 10px;
      row-gap: 14px;
      align-items: center;
      font-family: "Inter", sans-serif;
      color: #555;
      z-index: 2000;
      user-select: none;
    }
    #tpms svg {
      grid-column: 2;
      grid-row: 1 / span 2;
      width: 22px;
      height: 46px;
    }
    #tpms svg rect { fill: none; stroke: #999; stroke-width: 2; }
    .tpms-tire { display: flex; flex-direction: column; line-height: 1.1; }
    .tpms-left { align-items: flex-end; }
    .tpms-tire .p { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tpms-tire .t { font-size: 12px; color: #999; font-variant-numeric: tabular-nums; }
    .tpms-tire.low .p { color: #e5a00d; }
    .tpms-tire.critical .p { color: #e53935; }
    body.dark-mode #tpms { color: #e6e6e6; }
    body.dark-mode #tpms svg rect { stroke: #777; }
    #experimentalIcon {
      position: fixed;
      bottom: 30px;
      right: 40px;
      width: 48px;
      height: 48px;
      z-index: 2000;
      display: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="bevy-canvas"></canvas>
  </div>

  <div id="driverAlert"></div>

  <div id="collisionWarning"></div>
  <div id="leftBlindSpot"></div>
  <div id="rightBlindSpot"></div>
  
  <div id="speedSignRow">
    <span id="accSetSpeed">
      <span id="accValue"></span>
      <span id="accMax"></span>
    </span>
    <div id="speedLimitSign">
      <span id="speedLimitText">50</span>
    </div>
  </div>
  
  <div id="blinkerRow">
    <img id="leftBlinkerIcon" src="left.png" style="opacity: 0.0;" />
    <img id="rightBlinkerIcon" src="right.png" style="opacity: 0.0;" />
  </div>

  <div id="statusBar">
    <div class="battery-group" id="phoneBatteryGroup">
      <span class="battery-label">Phone</span>
      <div class="battery-shell">
        <div class="battery-fill" id="phoneBatteryFill" style="width: 0%; background: #4a90d9;"></div>
      </div>
      <span class="battery-percent" id="phoneBatteryPercent"></span>
    </div>
    <div class="status-separator" id="statusSeparator"></div>
    <div class="battery-group" id="carBatteryGroup" style="display: none;">
      <span class="battery-label" id="carBatteryLabel">Car</span>
      <div class="battery-shell" id="carBatteryShell">
        <div class="battery-fill" id="carBatteryFill"></div>
      </div>
      <span class="battery-percent" id="carBatteryPercent"></span>
      <span id="batteryTempText"></span>
    </div>
  </div>
  
  <div id="leftArea">
    <div id="powerBar">
      <div id="powerBarTrack">
        <div id="powerBarCenter"></div>
        <div id="powerBarFill"></div>
      </div>
    </div>
    <div id="leftColumn">
      <div id="warningIcons">
        <img id="seatbeltIcon" src="seat-belt.png" alt="Seatbelt unbuckled" />
        <img id="doorIcon" src="car-door.svg" alt="Door open" />
      </div>

      <div id="speedRow">
        <div id="speedText">0</div>
        <div id="speedUnit">km/h</div>
      </div>

      <div id="gearText">-</div>

      <div id="steeringContainer">
        <img id="steeringWheel" src="steering-wheel.svg" />
      </div>
    </div>
  </div>

    <div id="bottomLeft">
      <div id="odometer"></div>
    </div>

    <div id="tpms">
      <div class="tpms-tire tpms-left" id="tpmsFL"><span class="p"></span><span class="t"></span></div>
      <svg viewBox="0 0 22 46" aria-hidden="true"><rect x="2" y="2" width="18" height="42" rx="7" /></svg>
      <div class="tpms-tire" id="tpmsFR"><span class="p"></span><span class="t"></span></div>
      <div class="tpms-tire tpms-left" id="tpmsRL"><span class="p"></span><span class="t"></span></div>
      <div class="tpms-tire" id="tpmsRR"><span class="p"></span><span class="t"></span></div>
    </div>

    <img id="experimentalIcon" src="experimental.png" alt="Experimental mode" />

  <script>
    const leftBlinkerIcon = document.getElementById("leftBlinkerIcon");
    const rightBlinkerIcon = document.getElementById("rightBlinkerIcon");

    function showBorder(show) {
      const wrapper = document.getElementById("borderWrapper");
      wrapper.style.background = show ? "#5cbd68" : "#C1E7C8";
    }

    function showBlinker(blinkerState, blinkerIcon) {
      if (blinkerState == 2) {
          blinkerIcon.style.opacity = "1";
        } else if (blinkerState == 1) {
          blinkerIcon.style.opacity = "0.3";
        } else {
          blinkerIcon.style.opacity = "0.0";
        }
    }

    function applyBlindSpotBorderEffect(blindSpotState, blindSpotView) {
      blindSpotView.style.display = blindSpotState > 0 ? "block" : "none";
    }

    const TL_COLOR_MAP = { 1: "Red", 2: "Green", 3: "Yellow" };
    const TL_FIXED_DY = -3.0;

    function buildTrafficLightState(car, world) {
        const dist = car.stopLineDist;
        const colorName = TL_COLOR_MAP[car.trafficLightColor];

        if (colorName && dist != null && dist > 0) {
          world.traffic_lights = [{
            id: 1,
            Dx: dist,
            Dy: TL_FIXED_DY,
            state: colorName,
          }];
        } else {
          world.traffic_lights = [];
        }

        if (dist != null && dist > 0 && dist < 127) {
          world.stop_line_dist = dist;
        } else {
          world.stop_line_dist = null;
        }
      }

    // Critically damped spring toward a moving target (Game Programming Gems 4
    // "SmoothDamp"). Unlike exponential easing it keeps velocity continuous,
    // so a target that steps at the data rate (10-25 Hz) still glides when
    // evaluated every display frame. smoothTimeMs ~ time to catch up.
    class Smoother {
      constructor(value) {
        this.value = value;
        this.velocity = 0;
        this.lastMs = undefined;
      }

      update(target, smoothTimeMs, now) {
        if (this.lastMs === undefined) {
          this.lastMs = now;
          return this.value;
        }
        const dt = Math.min(0.1, Math.max(0, (now - this.lastMs) / 1000));
        this.lastMs = now;
        const omega = 2 / Math.max(0.001, smoothTimeMs / 1000);
        const x = omega * dt;
        const decay = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
        const change = this.value - target;
        const temp = (this.velocity + omega * change) * dt;
        this.velocity = (this.velocity - omega * temp) * decay;
        this.value = target + (change + temp) * decay;
        return this.value;
      }
    }

    const SIDE_LEFT_ID = 9981;
    const SIDE_RIGHT_ID = 9982;

    // Lateral offset (m, + = left) of the lane center at distance x ahead,
    // or 0 without lane data. With the viz's C1 quirk folded in, this is the
    // car's own polynomial times LANE_SIGN.
    function laneCenterDy(car, x) {
      if (!(Number(car.laneViewRange) > 0)) return 0;
      const c0 = Number(car.laneC0) || 0, c1 = Number(car.laneC1) || 0;
      const c2 = Number(car.laneC2) || 0, c3 = Number(car.laneC3) || 0;
      return LANE_SIGN * (c0 + x * (c1 + x * (c2 + x * c3)));
    }

    // DAS_lanes virtual lane. The car's polynomial is y = C0 + C1 x + C2 x^2
    // + C3 x^3 (meters). Measured in this viz: C0, C2 and C3 move the lane
    // left when positive, but C1 turns it right, so C1 is negated. Flip
    // LANE_SIGN if the lane bends the wrong way on a real drive.
    const LANE_SIGN = 1;
    const LANE_DEFAULT = { laneWidth: 4, viewRange: 50, lanePolyC0: 0, lanePolyC1: 0, lanePolyC2: 0, lanePolyC3: 0 };
    const LANE_MAX_VIEW_RANGE = 80;
    // assets/shaders/lane_fill_material.wgsl measures the fill mesh in whole
    // steps of this size so its animation follows curves; keep in sync.
    const LANE_VIEW_RANGE_STEP = 10;
    const LANE_SMOOTH_MS = 200;
    let laneSmoothers = null;

    // While driving manually the fill and lines show where the car will go
    // from the current steering angle (kinematic bicycle model), since the
    // viz draws both from one polynomial. Model 3/Y-ish constants.
    const STEER_RATIO = 12.0;          // steering wheel deg per road wheel deg
    const WHEELBASE_M = 2.875;
    const UNDERSTEER_S2_PER_M2 = 0.0012;
    const PATH_MAX_CURVATURE = 0.1;    // 1/m, ~10 m radius
    const PATH_RANGE_M = 50;
    // Fill colors: blue while lane keeping steers, neutral while you do.
    const FILL_COLOR_ASSIST = [0.1, 0.7, 0.9, 0.55];
    const FILL_COLOR_MANUAL = [0.75, 0.78, 0.82, 0.35];

    function steppedViewRange(range) {
      return Math.max(LANE_VIEW_RANGE_STEP,
        Math.round(Math.min(range, LANE_MAX_VIEW_RANGE) / LANE_VIEW_RANGE_STEP) * LANE_VIEW_RANGE_STEP);
    }

    // Curvature (1/m, + = left) the car will drive at its steering angle.
    function steeringCurvature(car) {
      const wheelDeg = -(Number(car.egoSteeringAngle) || 0) / STEER_RATIO;  // car: negative = left
      const v = egoSpeedMs(car);
      const k = Math.tan(wheelDeg * Math.PI / 180) / (WHEELBASE_M * (1 + UNDERSTEER_S2_PER_M2 * v * v));
      return Math.max(-PATH_MAX_CURVATURE, Math.min(PATH_MAX_CURVATURE, k));
    }

    function egoSpeedMs(car) {
      const v = Math.max(0, Number(car.egoSpeed) || 0);
      return car.isImperial ? v * 0.44704 : v / 3.6;
    }

    // Returns the lane polynomial to draw and whether it is the steering path.
    // Lane keeping engaged + lane data: the real lane (the car follows it).
    // Driving manually in D: the predicted steering path. Otherwise the real
    // lane if known, else straight.
    function buildLaneState(car, isDrive) {
      const now = performance.now();
      const viewRange = Number(car.laneViewRange) || 0;
      const hasLane = viewRange > 0;
      const lateralActive = !!(car.adasOn || car.madsActive);
      const steeringPath = isDrive && !(lateralActive && hasLane);

      let target, steppedRange;
      if (steeringPath) {
        const curvature = steeringCurvature(car);
        // A parabola only tracks the arc for x well under the radius.
        steppedRange = steppedViewRange(Math.min(PATH_RANGE_M, curvature !== 0 ? 1 / Math.abs(curvature) : PATH_RANGE_M));
        target = {
          laneWidth: hasLane ? (Number(car.laneWidth) || LANE_DEFAULT.laneWidth) : LANE_DEFAULT.laneWidth,
          lanePolyC0: 0,
          lanePolyC1: 0,
          lanePolyC2: curvature / 2,
          lanePolyC3: 0,
        };
      } else if (hasLane) {
        steppedRange = steppedViewRange(viewRange);
        target = {
          laneWidth: Number(car.laneWidth) || LANE_DEFAULT.laneWidth,
          lanePolyC0: LANE_SIGN * (Number(car.laneC0) || 0),
          lanePolyC1: -LANE_SIGN * (Number(car.laneC1) || 0),
          lanePolyC2: LANE_SIGN * (Number(car.laneC2) || 0),
          lanePolyC3: LANE_SIGN * (Number(car.laneC3) || 0),
        };
      } else {
        laneSmoothers = null;
        return { lane: { ...LANE_DEFAULT }, steeringPath: false };
      }

      // Same keys in every mode, so switching modes eases instead of jumping.
      if (!laneSmoothers) {
        laneSmoothers = {};
        for (const key of Object.keys(target)) laneSmoothers[key] = new Smoother(target[key]);
      }
      const lane = {};
      for (const key of Object.keys(target)) lane[key] = laneSmoothers[key].update(target[key], LANE_SMOOTH_MS, now);
      // View range is not smoothed: the fill shader needs it in whole steps.
      return { lane: { ...lane, viewRange: steppedRange }, steeringPath };
    }

    // DAS_status warnings -> viz events. The viz's lane departure names are
    // mirrored (LaneDepartureWarningRight reddens the left line), so a car
    // warning about the left line maps to ...Right.
    function buildWarningEvents(car, world) {
      const events = [];
      const ldw = Math.round(Number(car.laneDepartureWarning) || 0);
      if (ldw >= 1 && ldw <= 4) {
        const leftLine = ldw === 1 || ldw === 3;
        events.push({
          event_type: leftLine ? "LaneDepartureWarningRight" : "LaneDepartureWarningLeft",
          target_id: 0,
          severity: ldw >= 3 ? 1 : 0.5,
        });
      }
      const side = Math.round(Number(car.sideCollisionWarning) || 0);
      if (side === 1 || side === 3) events.push({ event_type: "BlindspotWarning", target_id: sideTargetId(car, "left"), severity: 1 });
      if (side === 2 || side === 3) events.push({ event_type: "BlindspotWarning", target_id: sideTargetId(car, "right"), severity: 1 });
      world.events = events;
    }

    function sideTargetId(car, side) {
      return side === "left" ? SIDE_LEFT_ID : SIDE_RIGHT_ID;
    }

    // A speed limit sign that appears ahead when the limit changes and
    // passes the car at its own speed, like driving past the real sign.
    const SPEED_SIGN_ID = 9972;
    const SPEED_SIGN_START_DX = 60;
    const SPEED_SIGN_END_DX = -12;
    const SPEED_SIGN_DY = -5;
    let speedSign = null;
    let lastSpeedLimit = 0;

    function buildSpeedLimitSign(car, world, speedMs, isDrive) {
      const limit = Math.round(Number(car.fusedSpeedLimit) || 0);
      const now = performance.now();
      if (limit > 0 && limit !== lastSpeedLimit && lastSpeedLimit !== 0 && isDrive) {
        speedSign = { limit, dx: SPEED_SIGN_START_DX, lastMs: now };
      }
      lastSpeedLimit = limit;
      if (!speedSign) return;
      speedSign.dx -= Math.max(speedMs, 3) * (now - speedSign.lastMs) / 1000;
      speedSign.lastMs = now;
      if (speedSign.dx < SPEED_SIGN_END_DX) {
        speedSign = null;
        return;
      }
      world.speed_limits = [{ id: SPEED_SIGN_ID, Dx: speedSign.dx, Dy: SPEED_SIGN_DY, speed_limit: speedSign.limit }];
    }

    // Pull the camera back while a blinker is on so more of the next lane
    // shows, easing in and out instead of snapping.
    const LANE_CHANGE_ZOOM = 1.25;
    const CAMERA_ZOOM_MS = 700;
    const cameraZoom = new Smoother(1.0);

    function laneChangeZoom(active) {
      const now = performance.now();
      return cameraZoom.update(active ? LANE_CHANGE_ZOOM : 1.0, CAMERA_ZOOM_MS, now);
    }

    const BS_DX = -3.0;
    const BS_DY_LEFT = 4.0;

    // One tracked vehicle per side for the blind spot monitor, which reports
    // presence but no position: the car slides in from off-screen behind
    // (the camera loses it past ~-14 m) into the blind spot zone, and drops
    // back out the same way when the blind spot clears.
    const SIDE_SMOOTH_MS = 250;
    const SIDE_ENTER_SMOOTH_MS = 600;
    const SIDE_SWITCH_MS = 1200;
    const SIDE_OFFSCREEN_DX = -16;
    const SIDE_GONE_DX = -14;
    const sideTracks = { left: {}, right: {} };

    function bsmVisible(car, side, alwaysOn) {
      const blinker = parseInt(car[side + "Blinker"]) > 0;
      const warn = Math.round(Number(car.sideCollisionWarning) || 0);
      const sideWarn = side === "left" ? (warn === 1 || warn === 3) : (warn === 2 || warn === 3);
      return (car[side + "BlindSpot"] > 0 && (alwaysOn || blinker)) || sideWarn;
    }

    function buildSideVehicles(car, world) {
      const now = performance.now();
      const alwaysOn = car.alwaysOnBlindSpotMonitor !== false;
      const laneOffset = Number(car.laneViewRange) > 0 ? (Number(car.laneWidth) || BS_DY_LEFT) : BS_DY_LEFT;

      for (const side of ["left", "right"]) {
        const t = sideTracks[side];
        const sign = side === "left" ? 1 : -1;

        let target = null;
        if (bsmVisible(car, side, alwaysOn)) target = { x: BS_DX, source: "bsm" };
        else if (t.x !== undefined && t.x > SIDE_GONE_DX) target = { x: SIDE_OFFSCREEN_DX, source: "exit" };
        if (!target) {
          t.x = undefined;
          t.source = undefined;
          continue;
        }
        if (t.x === undefined) {
          t.smoother = new Smoother(SIDE_OFFSCREEN_DX);
          t.switchUntil = now + SIDE_SWITCH_MS;
        } else if (t.source !== target.source) {
          t.switchUntil = now + SIDE_SWITCH_MS;
        }
        const smoothMs = now < (t.switchUntil || 0) ? SIDE_ENTER_SMOOTH_MS : SIDE_SMOOTH_MS;
        t.x = t.smoother.update(target.x, smoothMs, now);
        t.source = target.source;

        world.objects.push({
          id: side === "left" ? SIDE_LEFT_ID : SIDE_RIGHT_ID,
          Dx: t.x,
          // Side cars sit in the neighbouring lane, following its curve.
          Dy: laneCenterDy(car, t.x) + sign * laneOffset,
          VxRel: 0,
          vehicle_class: "Car",
          heading: 0,
        });
      }
    }

    // Tyre pressures are shown in psi whatever the units setting. Amber below
    // TPMS_LOW_BAR, red below TPMS_CRITICAL_BAR (Model Y placard: 2.9 bar).
    const TPMS_LOW_BAR = 2.5;
    const TPMS_CRITICAL_BAR = 2.2;
    const BAR_TO_PSI = 14.5038;

    function updateTpms(car) {
      const wheels = ["FL", "FR", "RL", "RR"];
      const any = wheels.some(w => Number(car["tpmsPressure" + w]) >= 0);
      document.getElementById("tpms").style.display = any ? "grid" : "none";
      if (!any) return;
      for (const w of wheels) {
        const el = document.getElementById("tpms" + w);
        const bar = Number(car["tpmsPressure" + w]);
        const temp = Number(car["tpmsTemp" + w]);
        const known = Number.isFinite(bar) && bar >= 0;
        el.querySelector(".p").textContent = !known ? "--"
          : Math.round(bar * BAR_TO_PSI) + " psi";
        el.querySelector(".t").textContent = Number.isFinite(temp) && temp > -100
          ? (car.isImperial ? Math.round(temp * 9 / 5 + 32) + "°F" : Math.round(temp) + "°C") : "";
        el.classList.toggle("critical", known && bar < TPMS_CRITICAL_BAR);
        el.classList.toggle("low", known && bar >= TPMS_CRITICAL_BAR && bar < TPMS_LOW_BAR);
      }
    }

    // The 3D world is rebuilt and sent every display frame from the latest
    // car state, rather than once per message (10 Hz demo, ~25 Hz DashKit),
    // so the smoothed vehicles, lane and camera move at the display rate.
    let latestCar = null;

    function buildWorld(car) {
      const gear = parseInt(car.gear);
      const leftBlinker = parseInt(car.leftBlinker);
      const rightBlinker = parseInt(car.rightBlinker);
      const speed = parseInt(car.egoSpeed);
      const roundedSpeed = Math.floor(speed / 10) * 10;

      // Build world object for ADAS viz
      const world = {
        ego_steering_angle: 0,
        ego_speed: car.egoSpeed,
        gear: car.gear,
        adas_on: car.adasOn,
        objects: [],
        traffic_lights:[],
        speed_limits:[],
        stop_signs:[],
        road_signs:[],
        pedestrians:[],
        events: [],
        lane: {laneWidth:4,viewRange:50,lanePolyC0:0,lanePolyC1:0,lanePolyC2:0,lanePolyC3:0},
        viz_config: {
          dark_mode: car.darkMode,
          lane_boundary_color: [1.0, 1.0, 1.0, 1.0],
          lane_fill_color: [0.1, 0.7, 0.9, 0.55],
          use_dark_ego_model: car.darkMode,
          dark_mode_background_color: [car.darkModeBackgroundGray / 255.0, car.darkModeBackgroundGray / 255.0, car.darkModeBackgroundGray / 255.0],
          render_quality: car.renderQuality
        },
      };

      buildTrafficLightState(car, world);
      buildSideVehicles(car, world);
      buildWarningEvents(car, world);

      const speedKmh    = car.isImperial ? roundedSpeed * 1.60934 : roundedSpeed;
      const cappedKmh   = Math.min(speedKmh, 70);
      const speedMs     = cappedKmh / 3.6;

      // The viz yaws the whole car model by this angle; the steering now
      // shows as the predicted path instead (buildLaneState).
      world.ego_steering_angle = 0;
      world.ego_speed = speedMs;

      const laneState = buildLaneState(car, gear === 4);
      world.lane = laneState.lane;
      // adas_on is what shows the fill, so keep it on for the steering path.
      world.adas_on = !!car.adasOn || laneState.steeringPath;
      world.viz_config.lane_fill_color = laneState.steeringPath && !car.adasOn ? FILL_COLOR_MANUAL : FILL_COLOR_ASSIST;

      const gearMap = { 1: "P", 2: "R", 3: "N", 4: "D" };

      buildSpeedLimitSign(car, world, speedMs, gearMap[gear] == "D");

      if (gearMap[gear] == "D") {
        world.camera_view = { view: "back", zoom: laneChangeZoom(leftBlinker > 0 || rightBlinker > 0) };
      } else if (gearMap[gear] == "P") {
        world.camera_view = { view: "left_side", zoom: 0.9 };
      } else if (gearMap[gear] == "R") {
        world.camera_view = { view: "top", zoom: 0.9 };
      } else {
        world.camera_view = { view: "back", zoom: 0.9 };
      }

      return world;
    }

    function vizFrame() {
      if (window._assetsReady && latestCar && window._setWorldModel) {
        try {
          window._setWorldModel(buildWorld(latestCar));
        } catch (err) {
          console.error("Failed to build world model", err);
        }
      }
      requestAnimationFrame(vizFrame);
    }
    requestAnimationFrame(vizFrame);

    var receiveMessage = function(car) {
      if (!window._assetsReady) return;
      try {
        document.body.classList.toggle("dark-mode", !!car.darkMode);

        const angle = car.egoSteeringAngle;
        const speed = parseInt(car.egoSpeed);
        const gear = parseInt(car.gear);
        const leftBlinker = parseInt(car.leftBlinker);
        const rightBlinker = parseInt(car.rightBlinker);
        const speedLimit = parseInt(car.fusedSpeedLimit);
        const roundedSpeed = Math.floor(speed / 10) * 10;

        latestCar = car;

        // Show gears
        const gearMap = { 1: "P", 2: "R", 3: "N", 4: "D" };
        gearText.textContent = gearMap[gear] || "-";


        showBlinker(leftBlinker,  leftBlinkerIcon);
        showBlinker(rightBlinker, rightBlinkerIcon);

        speedText.textContent = speed;
        speedUnit.textContent = car.isImperial ? "mph" : "km/h";

        const isParked = gearMap[gear] == "P";

        if (isParked || speedLimit == 0) {
          speedLimitText.textContent = "";
        } else {
          speedLimitText.textContent = speedLimit;
        }
        document.getElementById("speedSignRow").style.display = isParked ? "none" : "flex";

        const accSet = parseInt(car.accSetSpeed);

        if (!isParked && accSet > 0) {
          accValue.textContent = accSet;
          accMax.textContent = "max";
        } else {
          accValue.textContent = "";
          accMax.textContent = "";
        }

        const activeColor = car.darkMode ? "#1ab3e6" : "#5cbd68";
        accSetSpeed.style.color = car.adasOn ? activeColor : "#d3d3d3";

        const sideWarn = Math.round(Number(car.sideCollisionWarning) || 0);
        applyBlindSpotBorderEffect(car.leftBlindSpot > 0 || sideWarn === 1 || sideWarn === 3, leftBlindSpot);
        applyBlindSpotBorderEffect(car.rightBlindSpot > 0 || sideWarn === 2 || sideWarn === 3, rightBlindSpot);
        const fcw = Number(car.forwardCollisionWarning) > 0;
        document.getElementById("collisionWarning").style.display = fcw ? "block" : "none";

        const buckle = car.buckleStatus;
        seatbeltIcon.style.display = (buckle != null && buckle == 0) ? "block" : "none";

        // Door open warning
        const door = car.anyDoorOpen;
        doorIcon.style.display = (door != null && door > 0) ? "block" : "none";

        // Phone battery
        const phoneBatGroup = document.getElementById("phoneBatteryGroup");
        if (car.showPhoneBattery) {
          const phoneBat = car.phoneBattery;
          if (phoneBat != null && phoneBat >= 0) {
            phoneBatGroup.style.display = "flex";
            document.getElementById("phoneBatteryFill").style.width = phoneBat + "%";
            document.getElementById("phoneBatteryPercent").textContent = phoneBat + "%";
            if (phoneBat <= 20) {
              document.getElementById("phoneBatteryFill").style.background = "#ff4444";
            } else {
              document.getElementById("phoneBatteryFill").style.background = "#4a90d9";
            }
          }
        } else {
          phoneBatGroup.style.display = "none";
        }

        // Show separator only when both phone and car groups are visible
        document.getElementById("statusSeparator").style.display =
          (car.showPhoneBattery && car.showCarBattery) ? "block" : "none";

        // Battery SOC + temperature widget
        if (car.showCarBattery) {
          const fullPack = car.fullPackEnergy;
          const remaining = car.nominalEnergyRemaining;
          const buffer = car.energyBuffer;
          const tMin = car.packTMin;
          const tMax = car.packTMax;
          const hasBattery = fullPack > 0 && remaining > 0 && (fullPack - buffer) > 0;
          const hasTemp = tMin != null && tMax != null && (tMin > 0 || tMax > 0);

          if (hasBattery || hasTemp) {
            document.getElementById("carBatteryGroup").style.display = "flex";
          }
          if (hasBattery) {
            const soc = Math.round(((remaining - buffer) / (fullPack - buffer)) * 100);
            const clampedSoc = Math.max(0, Math.min(100, soc));
            document.getElementById("carBatteryFill").style.width = clampedSoc + "%";
            document.getElementById("carBatteryPercent").textContent = soc + "%";
            if (clampedSoc <= 20) {
              document.getElementById("carBatteryFill").style.background = "#ff4444";
            } else {
              document.getElementById("carBatteryFill").style.background = "#5cbd68";
            }
          }
          if (hasTemp) {
            const avgTemp = (tMin + tMax) / 2;
            document.getElementById("batteryTempText").textContent = avgTemp.toFixed(0) + (car.isImperial ? "°F" : "°C");
          }
        } else {
          document.getElementById("carBatteryGroup").style.display = "none";
        }

        // Power bar
        const powerLevel = car.powerLevel;
        if (powerLevel != null && car.maxDischargePower > 0 && car.maxRegenPower > 0) {
          document.getElementById("powerBar").style.display = "flex";
          const fill = document.getElementById("powerBarFill");
          const pct = Math.abs(powerLevel) / 2;
          if (powerLevel >= 0) {
            // Discharging — bar goes up from center
            fill.style.top = (50 - pct) + "%";
            fill.style.height = pct + "%";
            fill.style.background = "#555";
          } else {
            // Regenerating — bar goes down from center
            fill.style.top = "50%";
            fill.style.height = pct + "%";
            fill.style.background = "#5cbd68";
          }
        }

        updateTpms(car);

        // Odometer
        if (car.showOdometer) {
          const odo = car.odometer;
          if (odo != null && odo > 0) {
            document.getElementById("odometer").textContent = Math.round(odo).toLocaleString() + (car.isImperial ? " mi" : " km");
            document.getElementById("bottomLeft").style.display = "flex";
          }
        } else {
          document.getElementById("bottomLeft").style.display = "none";
        }

        // Experimental mode icon
        document.getElementById("experimentalIcon").style.display = car.experimentalMode ? "block" : "none";

        // Steering wheel: colorize when ADAS or MADS is active (blue in dark mode, green in light)
        if (car.adasOn || car.madsActive) {
          steeringWheel.style.filter = car.darkMode
            ? "brightness(0) saturate(100%) invert(60%) sepia(90%) saturate(500%) hue-rotate(160deg) brightness(95%) contrast(90%)"
            : "brightness(0) saturate(100%) invert(68%) sepia(52%) saturate(405%) hue-rotate(88deg) brightness(92%) contrast(87%)";
        } else {
          steeringWheel.style.filter = "";
        }

        // Rotate the steering wheel
        steeringWheel.style.transform = `rotate(${angle}deg)`;

        // Driver alerts
        const camDist = window.NativeCarState?.getSpeedCameraDistance?.() ?? -1;
        const isChangingLane = window.NativeCarState?.isChangingLane?.() ?? car.changingLane ?? false;
        const alertEl = document.getElementById('driverAlert');
        if (fcw) {
          alertEl.textContent = 'Collision warning';
          alertEl.style.display = 'block';
        } else if (isChangingLane) {
          alertEl.textContent = 'Changing lane';
          alertEl.style.display = 'block';
        } else if (camDist > 0) {
          alertEl.textContent = 'Speed camera ' + camDist + 'm ahead';
          alertEl.style.display = 'block';
        } else {
          alertEl.style.display = 'none';
        }
      } catch (err) {
        console.error("Failed to parse message", err);
      }
    };

    window.onCarStateUpdate = function() {
      var car = {
        egoSteeringAngle: NativeCarState.getEgoSteeringAngle(),
        egoSpeed: NativeCarState.getEgoSpeed(),
        leftBlinker: NativeCarState.getLeftBlinker(),
        rightBlinker: NativeCarState.getRightBlinker(),
        gear: NativeCarState.getGear(),
        adasOn: NativeCarState.isAdasOn(),
        leftBlindSpot: NativeCarState.getLeftBlindSpot(),
        rightBlindSpot: NativeCarState.getRightBlindSpot(),
        fusedSpeedLimit: NativeCarState.getFusedSpeedLimit(),
        stopLineDist: NativeCarState.getStopLineDist(),
        trafficLightColor: NativeCarState.getTrafficLightColor(),
        buckleStatus: NativeCarState.getBuckleStatus?.() ?? undefined,
        anyDoorOpen: NativeCarState.getAnyDoorOpen?.() ?? undefined,
        accSetSpeed: NativeCarState.getAccSetSpeed?.() ?? undefined,
        odometer: NativeCarState.getOdometer?.() ?? undefined,
        phoneBattery: NativeCarState.getPhoneBattery?.() ?? undefined,
        fullPackEnergy: NativeCarState.getFullPackEnergy?.() ?? undefined,
        nominalEnergyRemaining: NativeCarState.getNominalEnergyRemaining?.() ?? undefined,
        energyBuffer: NativeCarState.getEnergyBuffer?.() ?? undefined,
        packTMin: NativeCarState.getPackTMin?.() ?? undefined,
        packTMax: NativeCarState.getPackTMax?.() ?? undefined,
        maxRegenPower: NativeCarState.getMaxRegenPower?.() ?? undefined,
        maxDischargePower: NativeCarState.getMaxDischargePower?.() ?? undefined,
        packVoltage: NativeCarState.getPackVoltage?.() ?? undefined,
        packCurrent: NativeCarState.getPackCurrent?.() ?? undefined,
        powerLevel: NativeCarState.getPowerLevel?.() ?? undefined,
        showPhoneBattery: NativeCarState.getShowPhoneBattery?.() ?? true,
        showCarBattery: NativeCarState.getShowCarBattery?.() ?? true,
        showOdometer: NativeCarState.getShowOdometer?.() ?? true,
        isImperial: NativeCarState.isImperial?.() ?? false,
        darkMode: NativeCarState.isDarkMode?.() ?? false,
        alwaysOnBlindSpotMonitor: NativeCarState.isAlwaysOnBlindSpotMonitor?.() ?? true,
        experimentalMode: NativeCarState.isExperimentalMode?.() ?? false,
        madsActive: NativeCarState.isMadsActive?.() ?? false,
        renderQuality: NativeCarState.getRenderQuality?.() ?? 3,
        darkModeBackgroundGray: NativeCarState.getDarkModeBackgroundGray?.() ?? 0,
        tpmsPressureFL: NativeCarState.getTpmsPressureFL?.() ?? -1,
        tpmsPressureFR: NativeCarState.getTpmsPressureFR?.() ?? -1,
        tpmsPressureRL: NativeCarState.getTpmsPressureRL?.() ?? -1,
        tpmsPressureRR: NativeCarState.getTpmsPressureRR?.() ?? -1,
        tpmsTempFL: NativeCarState.getTpmsTempFL?.() ?? -100,
        tpmsTempFR: NativeCarState.getTpmsTempFR?.() ?? -100,
        tpmsTempRL: NativeCarState.getTpmsTempRL?.() ?? -100,
        tpmsTempRR: NativeCarState.getTpmsTempRR?.() ?? -100,
        laneWidth: NativeCarState.getLaneWidth?.() ?? 0,
        laneViewRange: NativeCarState.getLaneViewRange?.() ?? 0,
        laneC0: NativeCarState.getLaneC0?.() ?? 0,
        laneC1: NativeCarState.getLaneC1?.() ?? 0,
        laneC2: NativeCarState.getLaneC2?.() ?? 0,
        laneC3: NativeCarState.getLaneC3?.() ?? 0,
        forwardCollisionWarning: NativeCarState.getForwardCollisionWarning?.() ?? 0,
        laneDepartureWarning: NativeCarState.getLaneDepartureWarning?.() ?? 0,
        sideCollisionWarning: NativeCarState.getSideCollisionWarning?.() ?? 0,
      };
      receiveMessage(car);
    }

    window.receiveMessage = receiveMessage;

  </script>

  <script type="module">
    import init, { setWorldModel } from './car-visualization.js';

    window._setWorldModel = setWorldModel;

    window._onWasmReady = function() {
      console.log('[WASM] Bevy initialized, waiting for assets...');
    };

    window._onAssetsReady = function() {
      console.log('[WASM] Core assets loaded');
      if (typeof NativeCarState !== 'undefined') {
        console.log('[WASM] Running in native WebView, skipping WebSocket');
        return;
      }
      console.log('[WASM] Starting WebSocket');
      const ws = new WebSocket(`ws://${window.location.hostname}:8080`);
      ws.onopen    = () => console.log("WebSocket connected");
      ws.onmessage = (event) => receiveMessage(JSON.parse(event.data));
      ws.onerror   = (err) => console.error("WebSocket error", err);
      ws.onclose   = () => console.log("WebSocket closed");
    };

    init().catch(e => {
      if (!e.message?.includes("control flow")) {
        console.error("[WASM] init failed:", e);
      }
    });
  </script>
</body>
</html>
